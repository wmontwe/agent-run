# Keeps every pin current: agent CLIs (lockfiles in agents/<agent>/), the base
# image (Dockerfile), the proxy image (proxy/Dockerfile) and the relay image
# (proxy/github-relay/Dockerfile). The cooldown waits a
# week after a release before proposing it, so a compromised release has time
# to be caught and pulled first.
version: 2
updates:
  - package-ecosystem: npm
    directories: [/agents/claude, /agents/codex, /agents/gemini, /agents/pi]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: docker
    directories: [/, /proxy, /proxy/github-relay]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
