name: Publish signed images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  ci:
    name: Release checks
    needs: source
    uses: $/.github/workflows/build.yml
    with:
      release-artifacts: true

  publish:
    name: Publish ${{ matrix.name }}
    needs: [source, ci]
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [agent-claude, agent-codex, agent-gemini, agent-pi, build, proxy, github-relay, mirror]
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/release-image
      - name: Install registry transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Publish and sign digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release-image"
          test "$(cat "$archive/source-commit")" = "$SOURCE_COMMIT"
          test "$(skopeo inspect --format '{{.Os}}/{{.Architecture}}' "oci-archive:$archive/image.oci")" = linux/arm64
          name=${IMAGE_NAME#agent-}
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/$name"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$DOCKER_CONFIG/config.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --authfile "$DOCKER_CONFIG/config.json" --preserve-digests \
            --digestfile "$RUNNER_TEMP/image-digest" \
            "oci-archive:$archive/image.oci" "docker://$repository:$RELEASE_TAG"
          digest=$(cat "$RUNNER_TEMP/image-digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$repository@$digest"
          cosign sign --yes "$reference"
          mkdir -p "$RUNNER_TEMP/image-metadata"
          jq -n --arg name "$name" --arg reference "$reference" --arg commit "$SOURCE_COMMIT" \
            '{name: $name, reference: $reference, source_commit: $commit}' \
            > "$RUNNER_TEMP/image-metadata/$name.json"
      - name: Upload signed image metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/image-metadata/*.json
          if-no-files-found: error
          retention-days: 2

  manifest:
    name: Publish signed image set
    needs: [source, publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download signed image metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-metadata
          merge-multiple: true
      - name: Assemble image set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = {'claude', 'codex', 'gemini', 'pi', 'build', 'proxy', 'github-relay', 'mirror'}
          images = {}
          prefix = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '/'
          for path in sorted((root / 'image-metadata').glob('*.json')):
              item = json.loads(path.read_text())
              name = item['name']
              if name not in expected or name in images:
                  raise ValueError('unexpected or duplicate image: ' + name)
              if item['source_commit'] != os.environ['SOURCE_COMMIT']:
                  raise ValueError('mixed source commits')
              if not re.fullmatch(re.escape(prefix + name) + r'@sha256:[0-9a-f]{64}', item['reference']):
                  raise ValueError('invalid image reference')
              images[name] = item['reference']
          if set(images) != expected:
              raise ValueError('incomplete image set')
          manifest = {
              'schema_version': 1,
              'version': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'platform': 'linux/arm64',
              'images': images,
          }
          (root / 'images.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image set
        run: |
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/images.json.sigstore.json" "$RUNNER_TEMP/images.json"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/images.json" "$RUNNER_TEMP/images.json.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
