# Verifies every change, Dependabot's included: formatting, lints and unit tests, the oldest
# supported Rust, and that every image builds and passes runtime smoke checks. The launcher runs on macOS (Apple
# Silicon), so its checks run there; the images build on arm64 Linux, the Podman machine's
# architecture, and compile the gate and the build server. The Podman suites (`-- --ignored`)
# need the Podman machine and stay local.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-artifacts:
        description: Export tested runtime images for the release workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: .github/rustup.sh stable rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  rust-version:
    name: Minimum Rust version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, the oldest supported (rust-version in Cargo.toml)
        run: .github/rustup.sh "$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
      - run: cargo check --locked --workspace --all-targets

  images:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: agent-claude, args: --build-arg AGENT=claude -f image/Containerfile --ignorefile image/Containerfile.ignore .}
          - {name: agent-codex, args: --build-arg AGENT=codex -f image/Containerfile --ignorefile image/Containerfile.ignore .}
          - {name: agent-gemini, args: --build-arg AGENT=gemini -f image/Containerfile --ignorefile image/Containerfile.ignore .}
          - {name: agent-pi, args: --build-arg AGENT=pi -f image/Containerfile --ignorefile image/Containerfile.ignore .}
          - {name: build, args: -f build-image/Containerfile --ignorefile build-image/Containerfile.ignore .}
          - {name: gate, args: -f crates/gate/Containerfile --ignorefile crates/gate/Containerfile.ignore .}
          - {name: proxy, args: proxy}
          - {name: github-relay, args: proxy/github-relay}
          - {name: mirror, args: proxy/mirror}
    name: Image checks (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }
      - name: Rootless UID/GID mappings
        run: |
          # The Squid image contains UID/GID 584792; reserve room before Podman starts.
          start=$(awk -F: 'BEGIN { end = 65535 } { last = $2 + $3 - 1; if (last > end) end = last } END { printf "%.0f\n", end + 1 }' /etc/subuid /etc/subgid)
          end=$((start + 1048576 - 1))
          sudo usermod --add-subuids "$start-$end" --add-subgids "$start-$end" "$(id -un)"
          podman unshare cat /proc/self/uid_map /proc/self/gid_map
      - name: Build
        run: podman build -t localhost/agent-run-${{ matrix.name }} ${{ matrix.args }}
      - name: Smoke test
        timeout-minutes: 5
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: sh .github/smoke-image.sh "$IMAGE_NAME"
      - name: Export tested image
        if: inputs.release-artifacts && matrix.name != 'gate'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-image"
          test "$(podman image inspect --format '{{.Os}}/{{.Architecture}}' "localhost/agent-run-$IMAGE_NAME")" = linux/arm64
          podman save --format oci-archive -o "$RUNNER_TEMP/release-image/image.oci" "localhost/agent-run-$IMAGE_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/release-image/source-commit"
      - name: Upload tested image
        if: inputs.release-artifacts && matrix.name != 'gate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/release-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
