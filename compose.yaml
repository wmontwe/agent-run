# Start agents with bin/agent: it mounts the workspace's .git and .idea
# read-only, hides .signing, keeps /memory to plain notes, gives each
# container its own /tmp and reports risky changes afterwards. Plain `podman compose run`
# does none of this.
#
# Every agent is isolated from the others: its own image, home
# (~/.agent-run/<agent>/home), /tmp (bin/agent gives each container its own,
# removed with it), internal network, proxy and allowlist. Shared:
# the workspace, ~/.agent-run/knowledge (read-only, curated by you) and
# ~/.agent-run/memory (writable by every agent).

# A fixed project name keeps network and volume names (agent-run_tools, ...)
# independent of this checkout's folder name; bin/agent relies on them.
name: agent-run

# Settings shared by every agent service.
x-agent: &agent
  userns_mode: "keep-id:uid=1000,gid=1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Resource limits, so one agent can't starve the VM the others share.
  # AGENT_MEMORY raises the memory limit, e.g. for Gradle builds.
  mem_limit: ${AGENT_MEMORY:-4g}
  pids_limit: 1024
  cpus: 4
  # The workspace appears at its host path (bin/agent sets WORKSPACE), so
  # paths in build state and relative links mean the same on both sides.
  working_dir: ${WORKSPACE:-/workspace}
  environment:
    # Versions are pinned at build time (agents/<agent>/package-lock.json);
    # Claude Code's own updater would bypass the pin.
    DISABLE_AUTOUPDATER: "1"
    # The host terminal's identity, so CLIs render for it: Claude Code adapts
    # to JetBrains terminals by TERMINAL_EMULATOR, and Podman would set TERM=xterm.
    TERM: ${TERM:-xterm}
    COLORTERM: ${COLORTERM:-}
    TERM_PROGRAM: ${TERM_PROGRAM:-}
    TERM_PROGRAM_VERSION: ${TERM_PROGRAM_VERSION:-}
    TERMINAL_EMULATOR: ${TERMINAL_EMULATOR:-}
    # "proxy" resolves to the agent's own proxy, the only one on its network.
    HTTP_PROXY: http://proxy:3128
    HTTPS_PROXY: http://proxy:3128
    http_proxy: http://proxy:3128
    https_proxy: http://proxy:3128
    NO_PROXY: localhost,127.0.0.1,github-relay
    no_proxy: localhost,127.0.0.1,github-relay
    GITHUB_API_URL: http://github-relay:8080
    NODE_USE_ENV_PROXY: "1"
    MISE_TRUSTED_CONFIG_PATHS: ${WORKSPACE:-/workspace}
    # Java ignores the variables above; every JVM reads this one, Gradle's
    # daemons and test workers included. Same as JAVA_PROXY_OPTIONS in
    # lib/tools.sh.
    JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=proxy -Dhttp.proxyPort=3128 -Dhttps.proxyHost=proxy -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.0.0.1

# The firewall: the only containers with internet access. Each forwards HTTPS
# to the hosts in its agent's allowlist, plus the shared build allowlist
# (proxy/allowlists/build.txt), and refuses everything else.
x-proxy: &proxy
  # Squid image pinned in proxy/Dockerfile; one image for every proxy.
  build: {context: proxy}
  image: localhost/agent-run-proxy
  # The proxy is the only container with internet access, so it gets the same
  # hardening as the agents. Squid runs as an unprivileged user and only
  # writes pebble's state; its logs go to stdout and it caches nothing.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/var/lib/pebble/default:size=1m,mode=0700,U"]
  mem_limit: 256m
  pids_limit: 64
  cpus: 1

services:
  claude:
    <<: *agent
    build: {context: ., args: {AGENT: claude}}
    image: localhost/agent-run-claude
    command: claude
    depends_on: [proxy-claude]
    networks: [claude]
    volumes:
      - ${WORKSPACE:-./workspace}:${WORKSPACE:-/workspace}:z
      - ${HOME}/.agent-run/knowledge:/knowledge:ro,z
      - ${HOME}/.agent-run/memory:/memory:z
      - ${HOME}/.agent-run/claude/home:/home/node:z
  proxy-claude:
    <<: *proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro,z
      - ./proxy/allowlists/claude.txt:/etc/squid/allowed-domains.txt:ro,z
      - ./proxy/allowlists/build.txt:/etc/squid/build-domains.txt:ro,z
    networks:
      claude: {aliases: [proxy]}
      egress: {}

  codex:
    <<: *agent
    build: {context: ., args: {AGENT: codex}}
    image: localhost/agent-run-codex
    command: codex
    depends_on: [proxy-codex]
    networks: [codex]
    volumes:
      - ${WORKSPACE:-./workspace}:${WORKSPACE:-/workspace}:z
      - ${HOME}/.agent-run/knowledge:/knowledge:ro,z
      - ${HOME}/.agent-run/memory:/memory:z
      - ${HOME}/.agent-run/codex/home:/home/node:z
  proxy-codex:
    <<: *proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro,z
      - ./proxy/allowlists/codex.txt:/etc/squid/allowed-domains.txt:ro,z
      - ./proxy/allowlists/build.txt:/etc/squid/build-domains.txt:ro,z
    networks:
      codex: {aliases: [proxy]}
      egress: {}

  gemini:
    <<: *agent
    build: {context: ., args: {AGENT: gemini}}
    image: localhost/agent-run-gemini
    command: gemini
    depends_on: [proxy-gemini]
    networks: [gemini]
    volumes:
      - ${WORKSPACE:-./workspace}:${WORKSPACE:-/workspace}:z
      - ${HOME}/.agent-run/knowledge:/knowledge:ro,z
      - ${HOME}/.agent-run/memory:/memory:z
      - ${HOME}/.agent-run/gemini/home:/home/node:z
  proxy-gemini:
    <<: *proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro,z
      - ./proxy/allowlists/gemini.txt:/etc/squid/allowed-domains.txt:ro,z
      - ./proxy/allowlists/build.txt:/etc/squid/build-domains.txt:ro,z
    networks:
      gemini: {aliases: [proxy]}
      egress: {}

  pi:
    <<: *agent
    build: {context: ., args: {AGENT: pi}}
    image: localhost/agent-run-pi
    command: pi
    depends_on: [proxy-pi]
    networks: [pi]
    volumes:
      - ${WORKSPACE:-./workspace}:${WORKSPACE:-/workspace}:z
      - ${HOME}/.agent-run/knowledge:/knowledge:ro,z
      - ${HOME}/.agent-run/memory:/memory:z
      - ${HOME}/.agent-run/pi/home:/home/node:z
  proxy-pi:
    <<: *proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro,z
      - ./proxy/allowlists/pi.txt:/etc/squid/allowed-domains.txt:ro,z
      - ./proxy/allowlists/build.txt:/etc/squid/build-domains.txt:ro,z
    networks:
      pi: {aliases: [proxy]}
      egress: {}

  # Read-only GitHub REST API for the repositories in
  # ~/.agent-run/github-repos.txt; bin/agent starts it only if that file exists.
  # It shares every agent's network, but only ever forwards to api.github.com,
  # so it can't connect agents.
  github-relay:
    build: {context: proxy/github-relay}
    image: localhost/agent-run-github-relay
    entrypoint: [/bin/sh, /etc/nginx/start.sh]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 128m
    pids_limit: 64
    cpus: 1
    volumes:
      - ./proxy/github-relay/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./proxy/github-relay/start.sh:/etc/nginx/start.sh:ro,z
      - ${HOME}/.agent-run/github-repos.txt:/etc/github-repos.txt:ro,z
    networks: [claude, codex, gemini, pi, egress]

  # Only for bin/agent's tool install container (mise, Android SDK), which
  # sees no workspace. Agents never reach these hosts.
  proxy-tools:
    <<: *proxy
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro,z
      - ./proxy/allowlists/tools.txt:/etc/squid/allowed-domains.txt:ro,z
      - ./proxy/allowlists/none.txt:/etc/squid/build-domains.txt:ro,z
    networks:
      tools: {aliases: [proxy]}
      egress: {}

  # MCP servers: add them as services on one agent's network, so only that
  # agent can reach them (at http://<service>:<port>) and their traffic goes
  # through that agent's proxy. Add the hosts they need to its allowlist.
  #
  # mcp-example:
  #   image: <mcp server image>
  #   environment:
  #     HTTPS_PROXY: http://proxy:3128
  #   networks: [claude]

networks:
  # internal: true means no route out; only the agent's proxy bridges to egress.
  claude: {internal: true}
  codex: {internal: true}
  gemini: {internal: true}
  pi: {internal: true}
  tools: {internal: true}
  egress: {}

