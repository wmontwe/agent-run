# Read-only relay to the GitHub REST API. Unlike the CONNECT proxies it ends
# the agent's connection and opens its own, so it sees each request: GET and
# HEAD only, only for the repositories in ~/.agent-run/github-repos.txt, only to
# api.github.com, and without the agent's own headers.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    # The root is read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # start.sh writes this from the container's DNS servers. With a variable in
    # proxy_pass, nginx resolves per request, so GitHub's addresses can change.
    include /tmp/resolver.conf;

    map $request_uri $allowed_repo {
        default 0;
        include /tmp/github-repos.conf;
    }

    server {
        listen 8080;

        location / {
            if ($request_method !~ ^(GET|HEAD)$) { return 403; }
            # The raw URI is forwarded, so refuse what could leave the
            # repository after the prefix matched. The query may use %.
            if ($request_uri ~ "^[^?]*(\.\.|%|\x5c)") { return 403; }
            if ($allowed_repo = 0) { return 403; }

            set $github https://api.github.com;
            proxy_pass $github$request_uri;
            proxy_http_version 1.1;
            proxy_redirect off;

            proxy_ssl_server_name on;
            proxy_ssl_name api.github.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            # Only these reach GitHub, so an agent can't use its own token
            # or override the method.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host api.github.com;
            proxy_set_header User-Agent agent-run;
            proxy_set_header Accept $http_accept;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header Connection "";
        }
    }
}
