[package]
name = "buildrun"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "gradle-run: runs the project's Gradle wrapper in its build container, for agents in the same pod."

[[bin]]
name = "gradle-run"
path = "src/bin/gradle-run.rs"

[[bin]]
name = "gradle-run-server"
path = "src/bin/gradle-run-server.rs"

[dependencies]
md-5.workspace = true
sha2.workspace = true
